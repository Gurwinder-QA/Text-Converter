kind = "web"
previewPath = "/"
title = "QR Link Manager"
version = "1.0.0"
id = "artifacts/qr-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22871

[services.development]
run = "pnpm --filter @workspace/qr-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qr-admin", "run", "build" ]
publicDir = "artifacts/qr-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22871"
BASE_PATH = "/"
